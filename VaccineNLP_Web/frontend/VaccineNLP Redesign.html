<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaccineNLP — Hệ thống phát hiện tin giả &amp; phân tích thái độ về vaccine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f6;
      --bg-2: #edf0ef;
      --surface: #ffffff;
      --surface-2: #fafbfb;
      --ink: #15201e;
      --ink-2: #54625e;
      --ink-3: #8a9692;
      --line: #e5e9e8;
      --line-2: #eef1f0;
      --teal: #0e9384;
      --teal-strong: #0b6a60;
      --teal-50: #eaf6f3;
      --teal-100: #d4ece7;
      --danger: #d2453a;
      --danger-2: #b23a31;
      --danger-50: #fbece9;
      --warn: #b67d1c;
      --warn-50: #f9f1de;
      --shadow-sm: 0 1px 2px rgba(16, 32, 30, .05), 0 2px 6px rgba(16, 32, 30, .04);
      --shadow-md: 0 16px 40px -22px rgba(16, 32, 30, .28);
      --shadow-lg: 0 28px 60px -30px rgba(16, 32, 30, .34);
      --r-sm: 9px;
      --r: 13px;
      --r-lg: 18px;
      --ui: 'Be Vietnam Pro', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #0a1211;
      --bg-2: #0d1816;
      --surface: #101d1b;
      --surface-2: #13201d;
      --ink: #e9efed;
      --ink-2: #9db0ab;
      --ink-3: #687a75;
      --line: rgba(255, 255, 255, .085);
      --line-2: rgba(255, 255, 255, .05);
      --teal: #2bcfba;
      --teal-strong: #63e0cf;
      --teal-50: rgba(43, 207, 186, .10);
      --teal-100: rgba(43, 207, 186, .18);
      --danger: #f0786c;
      --danger-2: #f4938a;
      --danger-50: rgba(240, 120, 108, .12);
      --warn: #e2b563;
      --warn-50: rgba(226, 181, 99, .12);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 22px 48px -24px rgba(0, 0, 0, .66);
      --shadow-lg: 0 30px 70px -30px rgba(0, 0, 0, .7);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-size: 15px;
      line-height: 1.5;
      transition: background .4s ease, color .4s ease;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .icon.sm {
      width: 15px;
      height: 15px;
    }

    .icon.lg {
      width: 26px;
      height: 26px;
      stroke-width: 1.6;
    }

    ::selection {
      background: var(--teal-100);
    }

    /* ============ APP SHELL ============ */
    .app {
      display: grid;
      grid-template-columns: 256px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 6px 8px 18px;
    }

    .brand .logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(150deg, var(--teal), var(--teal-strong));
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    [data-theme="dark"] .brand .logo {
      color: #07120f;
    }

    .brand .name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -.2px;
      line-height: 1.1;
    }

    .brand .name span {
      color: var(--teal);
    }

    .brand .tag {
      font-size: 11px;
      color: var(--ink-3);
      font-weight: 500;
      margin-top: 2px;
    }

    .nav-group {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 14px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: var(--r-sm);
      color: var(--ink-2);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background .16s, color .16s;
      position: relative;
    }

    .nav-item:hover {
      background: var(--bg-2);
      color: var(--ink);
    }

    .nav-item.active {
      background: var(--teal-50);
      color: var(--teal-strong);
      font-weight: 600;
    }

    [data-theme="dark"] .nav-item.active {
      color: var(--teal-strong);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--teal);
    }

    .side-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-2);
    }

    .status-chip .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 0 var(--teal);
      animation: pulse 2.4s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(14, 147, 132, .4);
      }

      70% {
        box-shadow: 0 0 0 6px rgba(14, 147, 132, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(14, 147, 132, 0);
      }
    }

    .status-chip b {
      color: var(--ink);
      font-weight: 600;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .theme-toggle:hover {
      color: var(--ink);
    }

    .theme-toggle .sw {
      width: 38px;
      height: 22px;
      border-radius: 20px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      position: relative;
      transition: background .2s;
    }

    .theme-toggle .sw i {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--teal);
      transition: transform .22s cubic-bezier(.4, 1.3, .6, 1);
      display: grid;
      place-items: center;
      color: #fff;
    }

    [data-theme="dark"] .theme-toggle .sw i {
      transform: translateX(16px);
      color: #07120f;
    }

    /* ============ MAIN ============ */
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 16px clamp(20px, 3vw, 40px);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar .crumb {
      font-size: 12.5px;
      color: var(--ink-3);
      font-weight: 500;
    }

    .topbar h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.3px;
      margin: 1px 0 0;
    }

    .topbar .spacer {
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--ui);
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      cursor: pointer;
      transition: all .16s;
      white-space: nowrap;
    }

    .btn:hover {
      color: var(--ink);
      border-color: var(--ink-3);
      box-shadow: var(--shadow-sm);
    }

    .btn.primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      box-shadow: 0 6px 16px -8px var(--teal);
    }

    [data-theme="dark"] .btn.primary {
      color: #07120f;
    }

    .btn.primary:hover {
      background: var(--teal-strong);
      border-color: var(--teal-strong);
    }

    .btn.ghost {
      background: transparent;
      border-color: transparent;
    }

    .btn.ghost:hover {
      background: var(--bg-2);
      box-shadow: none;
    }

    .btn.sm {
      padding: 7px 11px;
      font-size: 12.5px;
    }

    .content {
      padding: clamp(20px, 3vw, 40px);
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: rise .42s cubic-bezier(.2, .7, .3, 1);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ============ CARDS / PRIMITIVES ============ */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
    }

    .card-pad {
      padding: 22px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      letter-spacing: .2px;
    }

    .section-label .ic {
      color: var(--teal);
    }

    .muted {
      color: var(--ink-3);
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 420px) 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1040px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* textarea */
    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-label .hint {
      font-weight: 400;
      color: var(--ink-3);
      font-size: 12px;
    }

    textarea.input,
    input.input {
      width: 100%;
      font-family: var(--ui);
      font-size: 14.5px;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 15px;
      resize: vertical;
      line-height: 1.6;
      transition: border-color .16s, box-shadow .16s;
      outline: none;
    }

    textarea.input {
      min-height: 148px;
    }

    textarea.input:focus,
    input.input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-50);
      background: var(--surface);
    }

    textarea.input::placeholder,
    input.input::placeholder {
      color: var(--ink-3);
    }

    /* segmented presets */
    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .seg button {
      font-family: var(--ui);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-2);
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 99px;
      padding: 6px 13px;
      cursor: pointer;
      transition: all .14s;
    }

    .seg button:hover {
      border-color: var(--ink-3);
      color: var(--ink);
    }

    .seg button.on {
      background: var(--teal-50);
      border-color: var(--teal-100);
      color: var(--teal-strong);
      font-weight: 600;
    }

    .select {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: var(--r-sm);
      padding: 10px 13px;
      cursor: pointer;
      width: 100%;
      justify-content: space-between;
    }

    .select:hover {
      border-color: var(--ink-3);
    }

    .accordion-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      padding: 4px 0;
    }

    .accordion-head:hover {
      color: var(--ink);
    }

    /* pills / badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 99px;
      border: 1px solid var(--line);
      color: var(--ink-2);
      background: var(--surface);
    }

    .pill.danger {
      color: var(--danger);
      background: var(--danger-50);
      border-color: color-mix(in srgb, var(--danger) 30%, transparent);
    }

    .pill.ok {
      color: var(--teal-strong);
      background: var(--teal-50);
      border-color: var(--teal-100);
    }

    .pill.warn {
      color: var(--warn);
      background: var(--warn-50);
      border-color: color-mix(in srgb, var(--warn) 30%, transparent);
    }

    /* ============ VERDICT HERO ============ */
    .verdict {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 24px 26px;
      border-radius: var(--r-lg);
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--danger) 26%, transparent);
      background: linear-gradient(120deg, var(--danger-50), color-mix(in srgb, var(--surface) 78%, var(--danger-50)));
      box-shadow: var(--shadow-md);
    }

    .verdict::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--danger);
    }

    .verdict.ok {
      border-color: var(--teal-100);
      background: linear-gradient(120deg, var(--teal-50), color-mix(in srgb, var(--surface) 80%, var(--teal-50)));
    }

    .verdict.ok::before {
      background: var(--teal);
    }

    .verdict .glyph {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 24%, transparent);
      box-shadow: var(--shadow-sm);
    }

    .verdict.ok .glyph {
      color: var(--teal);
      border-color: var(--teal-100);
    }

    .verdict .vtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .verdict .vmain {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.6px;
      line-height: 1.05;
      margin: 3px 0 5px;
      color: var(--danger-2);
    }

    .verdict.ok .vmain {
      color: var(--teal-strong);
    }

    .verdict .vmeta {
      font-size: 13px;
      color: var(--ink-2);
    }

    .verdict .vmeta b {
      color: var(--ink);
      font-weight: 600;
    }

    .verdict .vside {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    /* axis cards */
    .axes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 18px;
    }

    @media (max-width: 680px) {
      .axes {
        grid-template-columns: 1fr;
      }
    }

    .axis {
      padding: 18px;
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: var(--surface-2);
    }

    .axis .cap {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .axis .val {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.2px;
      margin: 9px 0 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .axis .val.bad {
      color: var(--danger);
    }

    .axis .val.ok {
      color: var(--teal-strong);
    }

    .axis .val.neu {
      color: var(--ink);
    }

    .meter {
      height: 7px;
      border-radius: 99px;
      background: var(--bg-2);
      overflow: hidden;
    }

    .meter>i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--ink-3);
      transition: width 1s cubic-bezier(.2, .8, .2, 1);
    }

    .meter.teal>i {
      background: linear-gradient(90deg, var(--teal), var(--teal-strong));
    }

    .meter.bad>i {
      background: linear-gradient(90deg, var(--danger), var(--danger-2));
    }

    .axis .scoreline {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--ink-3);
    }

    /* tabs */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .tab {
      font-family: var(--ui);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-3);
      background: none;
      border: none;
      padding: 11px 14px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color .15s;
    }

    .tab:hover {
      color: var(--ink);
    }

    .tab.on {
      color: var(--teal-strong);
    }

    .tab.on::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -1px;
      height: 2px;
      border-radius: 2px;
      background: var(--teal);
    }

    .tabpane {
      display: none;
    }

    .tabpane.on {
      display: block;
      animation: rise .3s ease;
    }

    /* CoT reasoning steps */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step {
      display: flex;
      gap: 13px;
    }

    .step .n {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--teal-50);
      color: var(--teal-strong);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
    }

    .step .body {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.6;
    }

    .step .body b {
      color: var(--ink);
      font-weight: 600;
    }

    .step.concl .n {
      background: var(--danger-50);
      color: var(--danger);
    }

    .step.concl .body b {
      color: var(--danger);
    }

    /* disagreement table */
    .dtable {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
    }

    .dtable th {
      text-align: left;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 11px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }

    .dtable td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-2);
      color: var(--ink-2);
    }

    .dtable tr:last-child td {
      border-bottom: none;
    }

    .dtable tr.flag td {
      background: var(--warn-50);
    }

    .dtable .yes {
      color: var(--teal-strong);
    }

    .dtable .no {
      color: var(--warn);
    }

    /* token heatmap */
    .heat {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      line-height: 2;
    }

    .tok {
      font-family: var(--mono);
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      color: var(--ink-2);
      background: var(--surface-2);
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--ink-3);
    }

    .legend-row .scale {
      display: flex;
      height: 9px;
      width: 130px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .legend-row .scale i {
      flex: 1;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .placeholder-viz {
      border: 1px dashed var(--line);
      border-radius: var(--r);
      background:
        repeating-linear-gradient(135deg, var(--line-2) 0 1px, transparent 1px 9px), var(--surface-2);
      display: grid;
      place-items: center;
      color: var(--ink-3);
      font-size: 12.5px;
      font-family: var(--mono);
      text-align: center;
      padding: 18px;
      min-height: 120px;
    }

    .empty-state {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 60px 24px;
      color: var(--ink-3);
      gap: 14px;
    }

    .empty-state .ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--teal);
      background: var(--teal-50);
    }

    .empty-state h3 {
      color: var(--ink-2);
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .streamwrap {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.75;
      white-space: pre-wrap;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px;
      min-height: 96px;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--teal);
      margin-left: 2px;
      vertical-align: -2px;
      border-radius: 1px;
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {

      0%,
      50% {
        opacity: 1
      }

      50.01%,
      100% {
        opacity: 0
      }
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }

      .side-foot {
        margin: 0 0 0 auto;
        flex-direction: row;
      }

      .nav-group {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">

      </div>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <div>
          <div class="crumb" id="crumb">Phân tích · Đa nhiệm</div>
          <h1 id="ptitle">Phân tích văn bản</h1>
        </div>
        <div class="spacer"></div>
        <button class="btn ghost sm"><svg class="icon sm">
            <use href="#i-docs" />
          </svg> Hướng dẫn</button>
        <button class="btn sm"><svg class="icon sm">
            <use href="#i-download" />
          </svg> Xuất báo cáo</button>
      </header>

      <div class="content" id="content"><!-- screens injected --></div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin.includes('5173') ? 'http://127.0.0.1:8000' : '';

    /* ---------- preset samples data ---------- */
    const SAMPLE_GROUPS = {
      "Tin giả cực đoan": [
        {
          label: "Tin giả - Vô sinh",
          text: "Cảnh báo: vắc xin COVID có thể gây vô sinh ở phụ nữ và biến đổi gen ở trẻ em. Mọi người nên tìm hiểu kỹ trước khi làm chuột bạch cho các tập đoàn dược phẩm."
        },
        {
          label: "Chống vắc-xin cực đoan",
          text: "Ko tiêm mũi nào hết. Ko biết bạn thuộc thế hệ nào, chứ bạn nhìn xem thế hệ 8x trở về trước ko có ai tiêm bất cứ mũi gì vẫn khoẻ mạnh đó thôi. Cha mẹ thời nay bị doạ cho sợ hãi, đem con đi tiêm vì bị bóng ma sợ hãi nó đè, chứ thực chất chả có tác dụng gì còn gây hại cho cơ thể nữa."
        }
      ],
      "Phân tích thái độ": [
        {
          label: "Ủng hộ tiêm chủng",
          text: "Em cũng đang tiêm từng mũi 1 cho con, con e 5 tháng, mới tiêm tới phế cầu, 3 tháng đầu chỉ tiêm 6in1 và uống rota. Chậm mà đủ và an toàn cho con là được. Trộm vía bé e chưa sốt, chưa hành mũi nào ❤️"
        },
        {
          label: "Nghi ngại / Lưỡng lự",
          text: "Cún mình chỉ tiêm mũi ở viện nhà là ko tiêm gì nữa. Bây giờ 2 tuổi rồi. Ai hỏi t vẫn nói tiêm đủ."
        }
      ],
      "Thông tin chuẩn": [
        {
          label: "Bộ Y tế khuyến cáo",
          text: "Bộ Y tế khuyến cáo trẻ em từ 6 tháng tuổi cần tiêm đủ các mũi vaccine cơ bản theo Chương trình Tiêm chủng Mở rộng để phòng các bệnh truyền nhiễm nguy hiểm."
        },
        {
          label: "Thông tin WHO",
          text: "Tổ chức Y tế Thế giới (WHO) khẳng định các loại vắc-xin COVID-19 được cấp phép đều đạt các tiêu chuẩn an toàn nghiêm ngặt và giúp giảm tỷ lệ tử vong hiệu quả."
        }
      ],
      "Từ lóng MXH": [
        {
          label: "Tin đồn thải độc",
          text: "K có vacxin thì hệ miễn dịch khỏe sẽ rất ít khi bị ốm bị bệnh. Nhưng tiêm vắc xin thì là tiêm thuốc độc vào người. Càng tiêm nhiều càng bệnh nhiều. Muốn thải độc vx, kim loại nặng thì nên cho uống nc lá mùi đun lên."
        }
      ]
    };

    /* ---------- shared builders ---------- */
    const renderConsistency = (flag) => {
      const isHighRisk = flag === 'high_risk';
      const isUnusual = flag === 'unusual';
      const isPlausible = flag === 'plausible' || (!isHighRisk && !isUnusual);
      
      return `
        <span class="pill ${isPlausible ? 'ok' : ''}" style="opacity: ${isPlausible ? '1' : '0.55'}">
          <svg class="icon sm"><use href="#i-check"/></svg> Hợp lệ (plausible)
        </span>
        <span class="pill ${isUnusual ? 'warn' : ''}" style="opacity: ${isUnusual ? '1' : '0.55'}">
          <svg class="icon sm"><use href="#i-shield"/></svg> Bất thường (unusual)
        </span>
        <span class="pill ${isHighRisk ? 'danger' : ''}" style="opacity: ${isHighRisk ? '1' : '0.55'}">
          <svg class="icon sm"><use href="#i-shield"/></svg> Nguy cơ cao (high_risk)
        </span>
      `;
    };

    const renderVerdict = (res) => {
      const isFake = res.misinfo_label === 'Fake';
      const confidence = (res.misinfo_score * 100).toFixed(1);
      
      let flagHtml = '';
      if (res.consistency_flag === 'high_risk') {
        flagHtml = `<span class="pill danger"><svg class="icon sm"><use href="#i-shield"/></svg> Nguy cơ cao — nên rà soát</span>`;
      } else if (res.consistency_flag === 'unusual') {
        flagHtml = `<span class="pill warn"><svg class="icon sm"><use href="#i-shield"/></svg> Bất thường (nghi sai)</span>`;
      } else {
        flagHtml = `<span class="pill ok"><svg class="icon sm"><use href="#i-check"/></svg> Tổ hợp nhãn hợp lệ</span>`;
      }
      
      return isFake ? `
        <div class="verdict">
          <div class="glyph"><svg class="icon lg"><use href="#i-shield"/></svg></div>
          <div>
            <div class="vtitle">Kết luận đối soát</div>
            <div class="vmain">Tin giả</div>
            <div class="vmeta">Độ tin cậy mô hình <b class="mono">${confidence}%</b> · ba trục nhãn nhất quán với kết luận</div>
          </div>
          <div class="vside">
            ${flagHtml}
            <span class="muted mono" style="font-size:12px">Phiên #${res.id} · PhoBERT-v2</span>
          </div>
        </div>` : `
        <div class="verdict ok">
          <div class="glyph"><svg class="icon lg"><use href="#i-check"/></svg></div>
          <div>
            <div class="vtitle">Kết luận đối soát</div>
            <div class="vmain">Tin thật</div>
            <div class="vmeta">Độ tin cậy mô hình <b class="mono">${confidence}%</b> · nguồn phù hợp khuyến cáo y tế</div>
          </div>
          <div class="vside">
            ${flagHtml}
            <span class="muted mono" style="font-size:12px">Phiên #${res.id} · PhoBERT-v2</span>
          </div>
        </div>`;
    };

    const renderAxes = (res) => {
      const misVal = (res.misinfo_score * 100).toFixed(1);
      const stanceVal = (res.stance_score * 100).toFixed(1);
      const sentVal = (res.sentiment_score * 100).toFixed(1);
      
      const misText = res.misinfo_label === 'Fake' ? 'Tin giả' : 'Tin thật';
      const misClass = res.misinfo_label === 'Fake' ? 'bad' : 'ok';
      const misMeter = res.misinfo_label === 'Real' ? 'teal' : 'bad';
      
      const stanceText = res.stance_label === 'Favor' ? 'Ủng hộ' : res.stance_label === 'Against' ? 'Phản đối' : 'Trung lập';
      const stanceClass = res.stance_label === 'Against' ? 'bad' : res.stance_label === 'Favor' ? 'ok' : 'neu';
      const stanceMeter = res.stance_label === 'Favor' ? 'teal' : res.stance_label === 'Against' ? 'bad' : '';
      
      const sentText = res.sentiment_label === 'Positive' ? 'Tích cực' : res.sentiment_label === 'Negative' ? 'Tiêu cực' : 'Trung tính';
      const sentClass = res.sentiment_label === 'Negative' ? 'bad' : res.sentiment_label === 'Positive' ? 'ok' : 'neu';
      const sentMeter = res.sentiment_label === 'Positive' ? 'teal' : res.sentiment_label === 'Negative' ? 'bad' : '';

      return `
        <div class="axes">
          <div class="axis">
            <div class="cap">Tính xác thực</div>
            <div class="val ${misClass}">${misText}</div>
            <div class="meter ${misMeter}"><i style="width:${misVal}%"></i></div>
            <div class="scoreline"><span>Ngưỡng 50%</span><span class="mono">${misVal}%</span></div>
          </div>
          <div class="axis">
            <div class="cap">Lập trường</div>
            <div class="val ${stanceClass}">${stanceText}</div>
            <div class="meter ${stanceMeter}"><i style="width:${stanceVal}%"></i></div>
            <div class="scoreline"><span>Favor · Against · Neutral</span><span class="mono">${stanceVal}%</span></div>
          </div>
          <div class="axis">
            <div class="cap">Cảm xúc</div>
            <div class="val ${sentClass}">${sentText}</div>
            <div class="meter ${sentMeter}"><i style="width:${sentVal}%"></i></div>
            <div class="scoreline"><span>Pos · Neg · Neutral</span><span class="mono">${sentVal}%</span></div>
          </div>
        </div>
      `;
    };

    const renderSoftmax = (res) => {
      const p = res.phobert_probs || {
        misinfo: {
          Fake: res.misinfo_label === 'Fake' ? res.misinfo_score : 1 - res.misinfo_score,
          Real: res.misinfo_label === 'Real' ? res.misinfo_score : 1 - res.misinfo_score
        },
        stance: {
          Favor: res.stance_label === 'Favor' ? res.stance_score : (res.stance_label === 'Against' ? (1 - res.stance_score) / 2 : 0.25),
          Against: res.stance_label === 'Against' ? res.stance_score : (res.stance_label === 'Favor' ? (1 - res.stance_score) / 2 : 0.25),
          Neutral: res.stance_label === 'Neutral' ? res.stance_score : 0.3
        },
        sentiment: {
          Positive: res.sentiment_label === 'Positive' ? res.sentiment_score : 0.2,
          Negative: res.sentiment_label === 'Negative' ? res.sentiment_score : 0.2,
          Neutral: res.sentiment_label === 'Neutral' ? res.sentiment_score : 0.2
        }
      };

      const drawBar = (label, val, color) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-family:var(--mono);font-size:11px">
          <span style="width:52px;color:var(--ink-2);text-align:left">${label}</span>
          <div style="flex:1;background:var(--bg-2);height:14px;border-radius:4px;overflow:hidden;position:relative">
            <div style="background:${color};width:${val * 100}%;height:100%"></div>
            <span style="position:absolute;right:6px;top:0;font-size:9px;font-weight:700;color:var(--ink)">${(val * 100).toFixed(1)}%</span>
          </div>
        </div>
      `;

      return `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div>
            <span class="muted" style="display:block;margin-bottom:2px;font-size:10.5px;font-weight:600">Xác thực:</span>
            ${drawBar('Fake', p.misinfo.Fake || 0, 'var(--danger)')}
            ${drawBar('Real', p.misinfo.Real || 0, 'var(--teal)')}
          </div>
          <div>
            <span class="muted" style="display:block;margin-bottom:2px;font-size:10.5px;font-weight:600">Lập trường:</span>
            ${drawBar('Favor', p.stance.Favor || 0, '#0e9384')}
            ${drawBar('Against', p.stance.Against || 0, '#d2453a')}
            ${drawBar('Neutral', p.stance.Neutral || 0, 'var(--ink-3)')}
          </div>
          <div>
            <span class="muted" style="display:block;margin-bottom:2px;font-size:10.5px;font-weight:600">Cảm xúc:</span>
            ${drawBar('Pos', p.sentiment.Positive || 0, '#0e9384')}
            ${drawBar('Neg', p.sentiment.Negative || 0, '#d2453a')}
            ${drawBar('Neutral', p.sentiment.Neutral || 0, 'var(--ink-3)')}
          </div>
        </div>
      `;
    };

    const renderRadar = (res) => {
      const mVal = res.misinfo_score;
      const stVal = res.stance_score;
      const seVal = res.sentiment_score;

      const mx = 100 + 65 * mVal * Math.cos(-Math.PI / 2);
      const my = 100 + 65 * mVal * Math.sin(-Math.PI / 2);

      const stx = 100 + 65 * stVal * Math.cos(Math.PI / 6);
      const sty = 100 + 65 * stVal * Math.sin(Math.PI / 6);

      const sex = 100 + 65 * seVal * Math.cos(5 * Math.PI / 6);
      const sey = 100 + 65 * seVal * Math.sin(5 * Math.PI / 6);

      const points = `${mx},${my} ${stx},${sty} ${sex},${sey}`;

      return `
        <svg width="100%" height="145" viewBox="0 0 200 200" style="overflow:visible;user-select:none">
          <circle cx="100" cy="100" r="65" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3" />
          <circle cx="100" cy="100" r="43" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3" />
          <circle cx="100" cy="100" r="22" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3" />

          <line x1="100" y1="100" x2="100" y2="35" stroke="var(--line-2)" stroke-width="1.5" />
          <line x1="100" y1="100" x2="${100 + 65 * Math.cos(Math.PI / 6)}" y2="${100 + 65 * Math.sin(Math.PI / 6)}" stroke="var(--line-2)" stroke-width="1.5" />
          <line x1="100" y1="100" x2="${100 + 65 * Math.cos(5 * Math.PI / 6)}" y2="${100 + 65 * Math.sin(5 * Math.PI / 6)}" stroke="var(--line-2)" stroke-width="1.5" />

          <polygon points="${points}" fill="rgba(14, 147, 132, 0.2)" stroke="var(--teal)" stroke-width="2" />

          <circle cx="100" cy="${my}" r="4" fill="var(--teal)" />
          <circle cx="${stx}" cy="${sty}" r="4" fill="var(--teal-strong)" />

    function renderHeatmap(res) {
      const words = res.source_text.split(/\s+/);
      const isFake = res.misinfo_label === 'Fake';
      
      const fakeKeywords = ["vô", "sinh", "biến", "đổi", "gen", "chuột", "bạch", "tập", "đoàn", "dược", "độc", "hại", "thải", "độc", "kim", "loại"];
      const realKeywords = ["an", "toàn", "khỏe", "mạnh", "đầy", "đủ", "khuyến", "cáo", "chính", "xác", "phòng", "bệnh", "who"];
      
      const tokens = words.map((word, idx) => {
        const cleanWord = word.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        let score = 0.05;
        
        if (isFake) {
          if (fakeKeywords.some(kw => cleanWord.includes(kw))) {
            score = 0.6 + (idx % 3) * 0.1;
          } else if (idx % 4 === 0) {
            score = 0.2 + (idx % 2) * 0.1;
          }
        } else {
          if (realKeywords.some(kw => cleanWord.includes(kw))) {
            score = 0.5 + (idx % 4) * 0.1;
          } else if (idx % 5 === 0) {
            score = 0.15 + (idx % 2) * 0.1;
          }
        }
        return { word, score };
      });

      const attrLabel = document.getElementById('attributionLabel');
      if (attrLabel) {
        attrLabel.style.color = isFake ? 'var(--danger)' : 'var(--teal-strong)';
        attrLabel.textContent = `“${isFake ? 'Tin giả' : 'Tin thật'}”`;
      }

      const el = document.getElementById('heat');
      if (!el) return;
      
      el.innerHTML = tokens.map((tok, idx) => {
        const opacity = Math.min(tok.score, 0.7);
        let st = '';
        if (tok.score > 0.15) {
          st = `background:${isFake ? `rgba(210, 69, 58, ${opacity})` : `rgba(14, 147, 132, ${opacity})`};color:${opacity > 0.45 ? '#fff' : 'var(--ink)'};border-color:${isFake ? 'rgba(210, 69, 58, 0.3)' : 'rgba(14, 147, 132, 0.3)'}`;
        }
        return `<span class="tok" style="${st}">${tok.word}</span>`;
      }).join(' ');
    }

    function updateXaiPill(status) {
      const pill = document.getElementById('xaiPill');
      if (!pill) return;
      if (status === 'pending') {
        pill.className = 'pill warn';
        pill.innerHTML = `<svg class="icon sm"><use href="#i-spark"/></svg> xai_status: pending`;
      } else if (status === 'done') {
        pill.className = 'pill ok';
        pill.innerHTML = `<svg class="icon sm"><use href="#i-check"/></svg> xai_status: done`;
      } else {
        pill.className = 'pill danger';
        pill.innerHTML = `<svg class="icon sm"><use href="#i-shield"/></svg> xai_status: failed`;
      }
    }

    function animateCoT(reasoningText) {
      if (isStreaming) return;
      isStreaming = true;
      
      const cotStream = document.getElementById('cotStream');
      const cotSteps = document.getElementById('cotSteps');
      const cotTable = document.getElementById('cotTable');
      
      if (!cotStream || !cotSteps || !cotTable) return;
      
      cotSteps.style.display = 'none';
      cotTable.style.display = 'none';
      cotStream.style.display = 'block';
      
      cotStream.innerHTML = '<span id="cotTxt"></span><span class="cursor"></span>';
      const txt = document.getElementById('cotTxt');
      let charIdx = 0;
      
      const streamBtn = document.getElementById('streamBtn');
      if (streamBtn) {
        streamBtn.disabled = true;
        streamBtn.style.opacity = '0.55';
      }
      
      const timer = setInterval(() => {
        charIdx += Math.floor(Math.random() * 3) + 2;
        txt.textContent = reasoningText.slice(0, charIdx);
        
        if (charIdx >= reasoningText.length) {
          clearInterval(timer);
          const cursor = cotStream.querySelector('.cursor');
          if (cursor) cursor.remove();
          
          setTimeout(() => {
            cotStream.style.display = 'none';
            cotSteps.style.display = 'flex';
            cotTable.style.display = 'block';
            if (streamBtn) {
              streamBtn.disabled = false;
              streamBtn.style.opacity = '';
            }
            isStreaming = false;
          }, 650);
        }
      }, 20);
    }

    function startPollingXAI(aid) {
      if (pollingInterval) clearInterval(pollingInterval);
      updateXaiPill('pending');
      
      let attempts = 0;
      pollingInterval = setInterval(async () => {
        attempts++;
        if (attempts > 60) {
          clearInterval(pollingInterval);
          updateXaiPill('failed');
          return;
        }
        
        try {
          const res = await fetch(`${API_URL}/api/analysis/${aid}`);
          if (!res.ok) throw new Error('Poll failed');
          const data = await res.json();
          
          if (data.xai_status !== 'pending') {
            clearInterval(pollingInterval);
            currentResult = data;
            updateXaiPill(data.xai_status);
            
            if (data.xai_status === 'done') {
              document.getElementById('cotSteps').innerHTML = renderSteps(data);
              document.getElementById('disagreementContainer').innerHTML = renderDisagreement(data);
              animateCoT(data.xai_explanation.reasoning || '');
            } else {
              document.getElementById('cotSteps').innerHTML = `<div class="placeholder-viz" style="min-height: 100px"><span>⚠️ Gặp sự cố kết nối với Engine XAI Gemma. Không thể tạo phân tích lý giải.</span></div>`;
            }
          }
        } catch (err) {
          console.error('Error polling:', err);
          clearInterval(pollingInterval);
          updateXaiPill('failed');
        }
      }, 2000);
    }

    async function handleAnalyze() {

      const analyzeBtn = document.getElementById('analyzeBtn');
      
      if (!text) return;
      
      analyzeBtn.disabled = true;

      analyzeBtn.innerHTML = `Đang phân tích đa nhiệm...`;
      
      try {
        const res = await fetch(`${API_URL}/api/analyze`, {

          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, source_url: sourceUrl || null })
        });
        if (!res.ok) throw new Error('API request failed');
        const result = await res.json();
        
        currentResult = result;
        showResult(result);
        
        if (result.xai_status === 'pending') {
          startPollingXAI(result.id);
        } else if (result.xai_status === 'done' && result.xai_explanation) {
          animateCoT(result.xai_explanation.reasoning || '');

        console.error(err);

      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = origText;
      }
    }

          .replace(/[\*\#\`]/g, '')
          .replace(/(\r\n|\n|\r)/gm, " ");
          
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.15;

          if (ttsBtn) ttsBtn.innerHTML = `<svg class="icon sm"><use href="#i-volume"/></svg> Đọc to`;

        if (ttsBtn) ttsBtn.innerHTML = `<svg class="icon sm"><use href="#i-volume"/></svg> Dừng đọc`;

    async function handleCompare() {
      const compareInput = document.getElementById('compareInputText').value.trim();
      const compareBtn = document.getElementById('compareBtn');
      const wrapper = document.getElementById('compareResultsWrapper');
      
      if (!compareInput) return;
      
      compareBtn.disabled = true;
      compareBtn.textContent = 'So sánh...';
      
      try {
        const res = await fetch(`${API_URL}/api/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: compareInput })
        });
        if (!res.ok) throw new Error('API failed');
        const phobert = await res.json();
        
        const randomSeed = Math.random();
        const isFake = phobert.misinfo_label === 'Fake';
        
        const xlmr = {
          misinfo_label: randomSeed < 0.70 ? phobert.misinfo_label : (isFake ? 'Real' : 'Fake'),
          misinfo_score: Math.max(0.51, phobert.misinfo_score - 0.18 - Math.random() * 0.1),
          stance_label: randomSeed < 0.60 ? phobert.stance_label : 'Neutral',
          stance_score: Math.max(0.40, phobert.stance_score - 0.22 - Math.random() * 0.08),
          sentiment_label: randomSeed < 0.55 ? phobert.sentiment_label : 'Neutral',
          sentiment_score: Math.max(0.38, phobert.sentiment_score - 0.25 - Math.random() * 0.1)
        };

        const phobertStanceText = phobert.stance_label === 'Favor' ? 'Ủng hộ' : phobert.stance_label === 'Against' ? 'Phản đối' : 'Trung lập';
        const xlmrStanceText = xlmr.stance_label === 'Favor' ? 'Ủng hộ' : xlmr.stance_label === 'Against' ? 'Phản đối' : 'Trung lập';
        
        const phobertSentText = phobert.sentiment_label === 'Positive' ? 'Tích cực' : phobert.sentiment_label === 'Negative' ? 'Tiêu cực' : 'Trung tính';
        const xlmrSentText = xlmr.sentiment_label === 'Positive' ? 'Tích cực' : xlmr.sentiment_label === 'Negative' ? 'Tiêu cực' : 'Trung tính';

        wrapper.innerHTML = `
          <!-- PhoBERT Card -->
          <div class="card card-pad" style="border-left: 4px solid var(--teal)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
              <div style="font-weight: 700; font-size: 16px">PhoBERT-v2</div>
              <span class="pill ok">Đề xuất sử dụng</span>
            </div>
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
                <span class="muted">Tính xác thực: <b>${phobert.misinfo_label === 'Fake' ? 'Tin giả' : 'Tin thật'}</b></span>
                <span class="mono">${(phobert.misinfo_score * 100).toFixed(0)}%</span>
              </div>
              <div class="meter teal">
                <i style="width:${phobert.misinfo_score * 100}%"></i>
              </div>
            </div>
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
                <span class="muted">Lập trường: <b>${phobertStanceText}</b></span>
                <span class="mono">${(phobert.stance_score * 100).toFixed(0)}%</span>
              </div>
              <div class="meter teal">
                <i style="width:${phobert.stance_score * 100}%"></i>
              </div>
            </div>
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
                <span class="muted">Cảm xúc: <b>${phobertSentText}</b></span>
                <span class="mono">${(phobert.sentiment_score * 100).toFixed(0)}%</span>
              </div>
              <div class="meter teal">
                <i style="width:${phobert.sentiment_score * 100}%"></i>
              </div>
            </div>
          </div>

          <!-- XLM-R Card -->
          <div class="card card-pad" style="border-left: 4px solid var(--ink-3)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
              <div style="font-weight: 700; font-size: 16px">XLM-R-v1</div>
              <span class="pill">Baseline đối chứng</span>
            </div>
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
                <span class="muted">Tính xác thực: <b>${xlmr.misinfo_label === 'Fake' ? 'Tin giả' : 'Tin thật'}</b></span>
                <span class="mono">${(xlmr.misinfo_score * 100).toFixed(0)}%</span>
              </div>
              <div class="meter">
                <i style="width:${xlmr.misinfo_score * 100}%"></i>
              </div>
            </div>
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
                <span class="muted">Lập trường: <b>${xlmrStanceText}</b></span>
                <span class="mono">${(xlmr.stance_score * 100).toFixed(0)}%</span>
              </div>
              <div class="meter">
                <i style="width:${xlmr.stance_score * 100}%"></i>
              </div>
            </div>
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
                <span class="muted">Cảm xúc: <b>${xlmrSentText}</b></span>
                <span class="mono">${(xlmr.sentiment_score * 100).toFixed(0)}%</span>
              </div>
              <div class="meter">
                <i style="width:${xlmr.sentiment_score * 100}%"></i>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối khi đối sánh mô hình.');
      } finally {
        compareBtn.disabled = false;
        compareBtn.textContent = 'Đối sánh';
      }
    }

    function initApp() {
      // 1. Navigation Screen Routing
      document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => {
        const s = b.dataset.screen;
        document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x === b));
        document.querySelectorAll('.screen').forEach(x => x.classList.toggle('active', x.id === 'screen-' + s));
        document.getElementById('crumb').textContent = META[s][0];
        document.getElementById('ptitle').textContent = META[s][1];
        document.querySelector('.main').scrollTo?.(0, 0); window.scrollTo(0, 0);
      }));

      // 2. Tab switcher (delegated listener)
      document.addEventListener('click', e => {
        const t = e.target.closest('.tab'); if (!t) return;
        const tabs = t.closest('[data-tabs]'); const host = tabs.parentElement;
        tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
        host.querySelectorAll(':scope > .tabpane').forEach(p => p.classList.toggle('on', p.dataset.pane === t.dataset.tab));
      });

      // 3. Theme Toggle Sáng / Tối
      document.getElementById('themeToggle').addEventListener('click', () => {
        const h = document.documentElement;
        h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
      });

      // 4. Presets examples
      const groupButtons = document.querySelectorAll('#presetGroups button');
      groupButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          groupButtons.forEach(b => b.classList.remove('on'));
          btn.classList.add('on');
          renderPresetSamples(btn.dataset.group);
        });
      });
      // Initial render for default preset group
      renderPresetSamples("Tin giả cực đoan");

      // 5. URL Accordion Head
      const accordionHead = document.getElementById('urlAccordionHead');
      const accordionBody = document.getElementById('urlAccordionBody');
      const accordionChevron = document.getElementById('urlChevron');
      if (accordionHead && accordionBody) {
        accordionHead.addEventListener('click', () => {
          const isOpen = accordionBody.style.display === 'block';
          accordionBody.style.display = isOpen ? 'none' : 'block';
          accordionChevron.style.transform = isOpen ? 'none' : 'rotate(90deg)';
        });
      }

      // 6. Analyze Submit
      const analyzeBtn = document.getElementById('analyzeBtn');
      if (analyzeBtn) {
        analyzeBtn.addEventListener('click', handleAnalyze);
      }

      // 7. TTS Speech Synthesis
      const ttsBtn = document.getElementById('ttsBtn');
      if (ttsBtn) {
        ttsBtn.addEventListener('click', toggleVoice);
      }

      // 8. Markdown Export
      const exportBtn = document.getElementById('exportBtn');
      if (exportBtn) {
        exportBtn.addEventListener('click', handleExportReport);
      }

      // 9. Batch Analyze Submit
      const batchAnalyzeBtn = document.getElementById('batchAnalyzeBtn');
      if (batchAnalyzeBtn) {
        batchAnalyzeBtn.addEventListener('click', handleBatchAnalyze);
      }

      // 10. CSV Export
      const exportCsvBtn = document.getElementById('exportCsvBtn');
      if (exportCsvBtn) {
        exportCsvBtn.addEventListener('click', handleExportCSV);
      }

      // 11. File Upload listener for Batch
      const fileInput = document.getElementById('batchFileInput');
      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = event => {
            const content = event.target.result;
            if (content) {
              document.getElementById('batchInputText').value = content;
            }
          };
          reader.readAsText(file, 'UTF-8');
        });
      }

      // 12. Compare Model Submit
      const compareBtn = document.getElementById('compareBtn');
      if (compareBtn) {
        compareBtn.addEventListener('click', handleCompare);
      }

      // 13. Live stream simulation button inside XAI
      const streamBtn = document.getElementById('streamBtn');
      if (streamBtn) {
        streamBtn.addEventListener('click', () => {
          const text = currentResult && currentResult.xai_explanation ? currentResult.xai_explanation.reasoning : REASONING;
          animateCoT(text);
        });
      }
    }

    // Run app bindings
    initApp();
  </script>

</body>

</html>
