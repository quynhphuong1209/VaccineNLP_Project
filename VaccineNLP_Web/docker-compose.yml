services:
  db:
    image: postgres:15
    container_name: vaccinenlp_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api_service:
    build: ./api_service
    container_name: vaccinenlp_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    mem_limit: 3g
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - XAI_SERVICE_URL=http://xai_service:8001
      - PHOBERT_PATH=/models/phobert_multitask.pt
    volumes:
      - ./api_service:/app
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - backend
      - frontend_net

  xai_service:
    build: ./xai_service
    container_name: vaccinenlp_xai
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    mem_limit: 6g
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GGUF_MODEL_PATH=/models/gemma-4-4b-Q4_K_M.gguf
      - LLM_THREADS=4
      - LMSTUDIO_URL=${LMSTUDIO_URL}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL}
      - LOCAL_FALLBACK=${LOCAL_FALLBACK}
      - XAI_BACKEND=${XAI_BACKEND}
      - LM_API_TOKEN=${LM_API_TOKEN}
      - XAI_CACHE_PATH=/xai_cache/xai_cache.json
    volumes:
      - ./xai_service:/app
      - ./models:/models:ro
      - ../app_gradio/data/xai_cache.json:/xai_cache/xai_cache.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    networks:
      - backend
      - frontend_net

  frontend:
    build: ./frontend
    container_name: vaccinenlp_frontend
    ports:
      - "5173:5173"
    mem_limit: 1g
    environment:
      - VITE_API_URL=
      - VITE_API_PROXY_TARGET=http://api_service:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - frontend_net

networks:
  backend:
    internal: true
  frontend_net: {}

volumes:
  postgres_data:
